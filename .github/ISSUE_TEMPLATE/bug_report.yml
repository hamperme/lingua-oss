name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include small synthetic input when possible. Do not post private transcripts, audio, or credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Swift version, OS, architecture, and relevant adapter/provider.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, personal audio, private transcripts, and other sensitive data.
          required: true
